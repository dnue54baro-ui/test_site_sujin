<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>대구남산 스마트 도시 샌드박스</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
:root {
  --font-display: 'Jua', sans-serif;
  --font-body: 'Gowun Dodum', sans-serif;
}
body {
  font-family: var(--font-body);
  background-color: #f1f5f9;
  color: #0f172a;
}
.font-display {
  font-family: var(--font-display);
}
.map-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(6, 1fr);
  aspect-ratio: 1 / 1;
}
</style>
</head>
<body class="p-3 md:p-6 min-h-screen">
  <div id="app" class="max-w-5xl mx-auto space-y-4"></div>
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-xl text-sm shadow-lg pointer-events-none transition-opacity opacity-0 z-50"></div>

<script>
(function(){
  const N = 6;
  const ROWS = ['가','나','다','라','마','바'];
  const COLS = ['①','②','③','④','⑤','⑥'];

  const FACILITIES = {
    stay: { name: '숙박시설', w: 2, h: 1, g: 3, r: -1, color: 'bg-purple-500', border: 'border-purple-600', text: 'text-purple-600', light: 'bg-purple-50', rot: true, hint: '외국인이 밤에 머무를 수 있는 호텔과 한옥 게스트하우스예요.', icon: '🏨' },
    expo: { name: '전시관', w: 2, h: 2, g: 3, r: -2, color: 'bg-blue-500', border: 'border-blue-600', text: 'text-blue-600', light: 'bg-blue-50', rot: false, hint: '볼거리와 신기술 체험을 제공하는 대형 국제 전시관이에요.', icon: '🏛️' },
    shop: { name: '상점가', w: 3, h: 1, g: 2, r: -1, color: 'bg-amber-500', border: 'border-amber-600', text: 'text-amber-600', light: 'bg-amber-50', rot: true, hint: '전통시장과 기념품점, 특색 있는 카페가 모여있는 거리예요.', icon: '🛍️' },
    stop: { name: '정류장', w: 1, h: 1, g: 2, r: 1, color: 'bg-rose-500', border: 'border-rose-600', text: 'text-rose-600', light: 'bg-rose-50', rot: false, hint: '지하철과 버스가 만나는 곳이에요. 남쪽 큰길 옆에만 설치할 수 있어요.', icon: '🚌' },
    park: { name: '주민공원', w: 2, h: 2, g: 0, r: 3, color: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-emerald-600', light: 'bg-emerald-50', rot: false, hint: '동네 사람들과 손님이 휴식하는 울창한 나무 그늘 공간이에요.', icon: '🌳' },
    info: { name: '안내센터', w: 1, h: 1, g: 1, r: 1, color: 'bg-teal-500', border: 'border-teal-600', text: 'text-teal-600', light: 'bg-teal-50', rot: false, hint: '외국어 안내 서비스와 여행지 정보를 전달하는 소형 센터예요.', icon: 'ℹ️' }
  };

  let state = {
    step: 1,
    group: null,
    picks: [],
    rot: {},
    pc: {},
    sel: null,
    towns: {},
    votes: {},
    viewTown: null,
    comment: { p: '', m: '', i: '' }
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.remove('opacity-0');
    t.classList.add('opacity-100');
    setTimeout(() => {
      t.classList.remove('opacity-100');
      t.classList.add('opacity-0');
    }, 2500);
  }

  function getDim(k, isRot) {
    const f = FACILITIES[k];
    return isRot && f.rot ? [f.h, f.w] : [f.w, f.h];
  }

  function getCells(k, r, c, isRot) {
    const [w, h] = getDim(k, isRot);
    const cells = [];
    for(let i=0; i<h; i++) {
      for(let j=0; j<w; j++) {
        cells.push([r + i, c + j]);
      }
    }
    return cells;
  }

  function isValidPlacement(k, r, c, isRot, currentPc) {
    const [w, h] = getDim(k, isRot);
    if(r < 0 || c < 0 || r + h > N || c + w > N) {
      return { ok: false, msg: '지도의 범위를 벗어납니다.' };
    }
    if(k === 'stop' && r !== N - 1) {
      return { ok: false, msg: '정류장은 큰길 옆(맨 아랫줄 \'바\')에만 배치할 수 있습니다.' };
    }
    const myCells = getCells(k, r, c, isRot);
    for(const key of Object.keys(currentPc)) {
      if(key === k) continue;
      const other = currentPc[key];
      const otherCells = getCells(key, other.r, other.c, state.rot[key]);
      const overlap = myCells.some(([r1, c1]) => otherCells.some(([r2, c2]) => r1 === r2 && c1 === c2));
      if(overlap) return { ok: false, msg: '다른 시설과 겹칩니다.' };
    }
    return { ok: true };
  }

  function isAdjacent(cellsA, cellsB) {
    return cellsA.some(([r1, c1]) => 
      cellsB.some(([r2, c2]) => Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1)
    );
  }

  function calculateScore(picks, pcMap) {
    let guest = 0;
    let resident = 0;
    let details = [];

    picks.forEach(k => {
      const f = FACILITIES[k];
      guest += f.g;
      resident += f.r;
      details.push({ label: f.name, g: f.g, r: f.r });
    });

    const hasStop = picks.includes('stop');
    if(!hasStop) {
      guest -= 4;
      details.push({ label: '정류장 미설치 (접근성 저하)', g: -4, r: 0 });
    }

    const placedCells = {};
    picks.forEach(k => {
      if(pcMap[k]) {
        placedCells[k] = getCells(k, pcMap[k].r, pcMap[k].c, state.rot[k]);
      }
    });

    if(hasStop && placedCells.stop) {
      ['stay', 'expo', 'shop'].forEach(k => {
        if(placedCells[k] && isAdjacent(placedCells.stop, placedCells[k])) {
          guest += 1;
          details.push({ label: `연결 보너스 (${FACILITIES[k].name} ↔ 정류장)`, g: 1, r: 0 });
        }
      });
    }

    if(placedCells.park) {
      ['stay', 'expo', 'shop'].forEach(k => {
        if(placedCells[k] && isAdjacent(placedCells.park, placedCells[k])) {
          resident += 1;
          details.push({ label: `쾌적성 보너스 (주민공원 ↔ ${FACILITIES[k].name})`, g: 0, r: 1 });
        }
      });
    }

    return { guest, resident, details };
  }

  function renderHeader() {
    const steps = [
      { id: 1, name: '모둠선택' },
      { id: 2, name: '카드선택' },
      { id: 3, name: '도시배치' },
      { id: 4, name: '점수분석' },
      { id: 5, name: '다른도시탐방' },
      { id: 6, name: '결과공유' }
    ];
    return `
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
        <div>
          <h1 class="text-xl md:text-2xl font-display text-teal-700">대구남산 스마트 도시 샌드박스</h1>
          <p class="text-xs md:text-sm text-slate-500">세계 손님이 찾아오는 경쟁력 있고 살기 좋은 도시 만들기</p>
        </div>
        ${state.group ? `<span class="bg-teal-600 text-white font-display px-3 py-1.5 rounded-full text-sm">모둠 ${state.group}</span>` : ''}
      </div>
      <nav class="grid grid-cols-6 gap-1 md:gap-2">
        ${steps.map(s => {
          const active = state.step === s.id;
          const disabled = (s.id > 1 && !state.group) || (s.id > 2 && state.picks.length < 4) || (s.id > 3 && Object.keys(state.pc).length < 4);
          return `
            <button onclick="window.goStep(${s.id})" ${disabled ? 'disabled' : ''} 
              class="flex flex-col items-center justify-center p-2 rounded-xl text-xs md:text-sm font-display transition ${active ? 'bg-teal-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'} ${disabled ? 'opacity-40 cursor-not-allowed' : ''}">
              <span>${s.id}</span>
              <span class="hidden md:inline text-[11px] font-sans font-normal">${s.name}</span>
            </button>
          `;
        }).join('')}
      </nav>
    `;
  }

  function renderMap(pcMap, isEditable = false) {
    let cellsHTML = '';
    for(let r=0; r<N; r++) {
      for(let c=0; c<N; c++) {
        cellsHTML += `<button onclick="window.onCellClick(${r}, ${c})" class="border-b border-r border-amber-200 hover:bg-teal-100/50 transition" ${!isEditable ? 'disabled' : ''}></button>`;
      }
    }

    let piecesHTML = '';
    Object.keys(pcMap).forEach(k => {
      const p = pcMap[k];
      const f = FACILITIES[k];
      const [w, h] = getDim(k, state.rot[k]);
      const isSelected = state.sel === k;
      piecesHTML += `
        <div onclick="event.stopPropagation(); window.onPieceClick('${k}')" 
          class="absolute p-1 transition-all flex flex-col items-center justify-center rounded-lg border-2 shadow-sm ${f.color} text-white font-display text-xs md:text-sm cursor-pointer ${isSelected ? 'ring-4 ring-slate-800 z-10 scale-95' : ''}"
          style="left: ${(p.c / N) * 100}%; top: ${(p.r / N) * 100}%; width: ${(w / N) * 100}%; height: ${(h / N) * 100}%;">
          <span class="text-base md:text-lg">${f.icon}</span>
          <span class="truncate w-full text-center leading-tight">${f.name}</span>
        </div>
      `;
    });

    return `
      <div class="space-y-2">
        <div class="grid grid-cols-[auto_1fr] gap-1">
          <div class="flex flex-col justify-around text-xs text-slate-400 font-display pr-1">
            ${ROWS.map(r => `<span>${r}</span>`).join('')}
          </div>
          <div>
            <div class="grid grid-cols-6 text-center text-xs text-slate-400 font-display mb-1">
              ${COLS.map(c => `<span>${c}</span>`).join('')}
            </div>
            <div class="relative bg-amber-50 border-2 border-amber-300 rounded-xl overflow-hidden map-grid shadow-inner">
              ${cellsHTML}
              ${piecesHTML}
            </div>
          </div>
        </div>
        <div class="bg-slate-700 text-slate-100 py-1.5 px-3 rounded-lg text-xs md:text-sm font-display flex justify-between items-center shadow-sm">
          <span>🚗 남쪽 도로 (큰길)</span>
          <span class="text-slate-300 text-xs font-sans">지하철역 출입구 동쪽 연계</span>
        </div>
      </div>
    `;
  }

  function viewStep1() {
    return `
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
        <div class="border-l-4 border-teal-600 pl-4 space-y-1">
          <h2 class="text-lg font-display text-teal-800">탐구 질문</h2>
          <p class="text-base text-slate-700 font-medium">세계 손님이 찾아오는 경쟁력 있는 도시로 개발하려면 시설을 어떻게 배치해야 할까?</p>
        </div>
        
        <div class="space-y-3">
          <h3 class="font-display text-slate-800">1. 우리 모둠을 선택해 주세요</h3>
          <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
            ${[1, 2, 3, 4, 5, 6].map(g => `
              <button onclick="window.selectGroup(${g})" 
                class="p-4 rounded-xl border-2 font-display text-lg flex flex-col items-center justify-center transition ${state.group === g ? 'border-teal-600 bg-teal-50 text-teal-700 shadow-md' : 'border-slate-200 hover:border-slate-300 bg-slate-50 text-slate-700'}">
                <span>모둠 ${g}</span>
                <span class="text-xs font-sans font-normal text-slate-500 mt-1">${state.towns['g'+g] ? '제출 완료' : '미제출'}</span>
              </button>
            `).join('')}
          </div>
        </div>

        <div class="flex justify-end">
          <button onclick="window.goStep(2)" ${!state.group ? 'disabled' : ''} 
            class="bg-teal-600 hover:bg-teal-700 text-white font-display px-6 py-3 rounded-xl shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed">
            시설 카드 고르기 →
          </button>
        </div>
      </div>
    `;
  }

  function viewStep2() {
    return `
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-lg font-display text-slate-800">2. 개발 시설 카드 선택 (4장 선택)</h2>
            <p class="text-sm text-slate-500">세계 손님이 올 수 있도록 필요한 시설을 골라보세요.</p>
          </div>
          <span class="bg-teal-100 text-teal-800 font-display px-3 py-1 rounded-full text-sm">
            ${state.picks.length} / 4 선택됨
          </span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          ${Object.keys(FACILITIES).map(k => {
            const f = FACILITIES[k];
            const isPicked = state.picks.includes(k);
            return `
              <div onclick="window.togglePick('${k}')" 
                class="p-4 rounded-xl border-2 cursor-pointer transition flex flex-col justify-between space-y-3 ${isPicked ? 'border-teal-600 bg-teal-50/50 shadow-md' : 'border-slate-200 hover:border-slate-300 bg-white'}">
                <div class="flex items-start justify-between">
                  <div class="flex items-center space-x-2">
                    <span class="text-2xl">${f.icon}</span>
                    <div>
                      <h3 class="font-display text-slate-800">${f.name}</h3>
                      <span class="text-xs text-slate-400 font-sans">${f.w * 10}m × ${f.h * 10}m (${f.w * f.h}칸)</span>
                    </div>
                  </div>
                  <input type="checkbox" ${isPicked ? 'checked' : ''} class="w-5 h-5 accent-teal-600 pointer-events-none">
                </div>
                <p class="text-xs text-slate-600 leading-relaxed">${f.hint}</p>
              </div>
            `;
          }).join('')}
        </div>

        <div class="flex justify-between">
          <button onclick="window.goStep(1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-display px-5 py-2.5 rounded-xl transition">
            ← 이전
          </button>
          <button onclick="window.goStep(3)" ${state.picks.length !== 4 ? 'disabled' : ''} 
            class="bg-teal-600 hover:bg-teal-700 text-white font-display px-6 py-2.5 rounded-xl shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed">
            지도에 배치하기 →
          </button>
        </div>
      </div>
    `;
  }

  function viewStep3() {
    return `
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
        <div class="md:col-span-7 bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
          <h2 class="text-lg font-display text-slate-800">3. 지도에 시설 배치하기</h2>
          ${renderMap(state.pc, true)}
        </div>

        <div class="md:col-span-5 bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between space-y-4">
          <div class="space-y-4">
            <h3 class="font-display text-slate-800">시설 선택 후 위치 클릭</h3>
            
            <div class="space-y-2">
              ${state.picks.map(k => {
                const f = FACILITIES[k];
                const isPlaced = !!state.pc[k];
                const isSelected = state.sel === k;
                return `
                  <button onclick="window.selectFacility('${k}')" 
                    class="w-full p-3 rounded-xl border-2 text-left flex items-center justify-between transition ${isSelected ? 'border-teal-600 bg-teal-50 ring-2 ring-teal-600/20' : 'border-slate-200 hover:bg-slate-50'}">
                    <div class="flex items-center space-x-3">
                      <span class="text-xl">${f.icon}</span>
                      <div>
                        <div class="font-display text-slate-800 text-sm">${f.name}</div>
                        <div class="text-xs text-slate-400">${isPlaced ? '배치 완료' : '미배치'}</div>
                      </div>
                    </div>
                    ${f.rot ? `<span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded">회전가능</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>

            <div class="flex gap-2">
              <button onclick="window.rotateSelected()" ${!state.sel || !FACILITIES[state.sel]?.rot ? 'disabled' : ''} 
                class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-display py-2 rounded-xl text-xs transition disabled:opacity-40">
                🔄 방향 회전
              </button>
              <button onclick="window.removeSelected()" ${!state.sel || !state.pc[state.sel] ? 'disabled' : ''} 
                class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 font-display py-2 rounded-xl text-xs transition disabled:opacity-40">
                ❌ 배치 취소
              </button>
            </div>
          </div>

          <div class="flex justify-between pt-4 border-t border-slate-100">
            <button onclick="window.goStep(2)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-display px-4 py-2 rounded-xl text-sm transition">
              ← 이전
            </button>
            <button onclick="window.goStep(4)" ${Object.keys(state.pc).length < 4 ? 'disabled' : ''} 
              class="bg-teal-600 hover:bg-teal-700 text-white font-display px-5 py-2 rounded-xl text-sm shadow-sm transition disabled:opacity-50">
              점수 분석하기 →
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function viewStep4() {
    const score = calculateScore(state.picks, state.pc);
    return `
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
        <div class="md:col-span-6 bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
          <h2 class="text-lg font-display text-slate-800">우리 모둠 도시 지도</h2>
          ${renderMap(state.pc, false)}
        </div>

        <div class="md:col-span-6 bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-5">
          <h2 class="text-lg font-display text-slate-800">개발 결과 및 경쟁력 분석</h2>

          <div class="grid grid-cols-2 gap-3">
            <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-center">
              <span class="text-xs text-blue-600 font-display">손님 점수 (경제적 경쟁력)</span>
              <div class="text-3xl font-display text-blue-700 mt-1">${score.guest}점</div>
            </div>
            <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center">
              <span class="text-xs text-emerald-600 font-display">주민 점수 (장소적 쾌적성)</span>
              <div class="text-3xl font-display text-emerald-700 mt-1">${score.resident}점</div>
            </div>
          </div>

          <div class="space-y-2">
            <h3 class="text-sm font-display text-slate-700">세부 점수 내역</h3>
            <div class="bg-slate-50 rounded-xl p-3 max-h-40 overflow-y-auto divide-y divide-slate-200 text-xs">
              ${score.details.map(d => `
                <div class="py-1.5 flex justify-between">
                  <span class="text-slate-600">${d.label}</span>
                  <div class="space-x-2 font-display">
                    <span class="${d.g >= 0 ? 'text-blue-600' : 'text-rose-600'}">손님 ${d.g >= 0 ? '+'+d.g : d.g}</span>
                    <span class="${d.r >= 0 ? 'text-emerald-600' : 'text-rose-600'}">주민 ${d.r >= 0 ? '+'+d.r : d.r}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="flex justify-between pt-2">
            <button onclick="window.goStep(3)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-display px-4 py-2 rounded-xl text-sm transition">
              ← 배치 수정
            </button>
            <button onclick="window.submitTown()" class="bg-teal-600 hover:bg-teal-700 text-white font-display px-6 py-2 rounded-xl text-sm shadow-sm transition">
              게시판에 제출하기 →
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function viewStep5() {
    const otherGroups = [1,2,3,4,5,6].filter(g => g !== state.group);
    
    if(state.viewTown) {
      const targetGroup = state.viewTown;
      const town = state.towns['g' + targetGroup];
      return `
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
          <div class="md:col-span-6 bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
            <button onclick="window.setViewTown(null)" class="text-xs text-teal-600 font-display hover:underline">← 목록으로 돌아가기</button>
            <h2 class="text-lg font-display text-slate-800">모둠 ${targetGroup}의 도시 개발 지도</h2>
            ${renderMap(town.pc, false)}
          </div>

          <div class="md:col-span-6 bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-lg font-display text-slate-800">PMI 카드로 평가 및 투표하기</h2>
            
            <div class="space-y-3">
              <div>
                <label class="block text-xs font-display text-slate-700 mb-1">👍 P (Plus / 좋은 점)</label>
                <textarea id="pmi_p" oninput="window.updateComment('p', this.value)" class="w-full text-xs p-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none h-16" placeholder="예: 정류장과 전시관이 잘 연결되어 있어 방문하기 매우 편리합니다.">${state.comment.p}</textarea>
              </div>
              <div>
                <label class="block text-xs font-display text-slate-700 mb-1">⚠️ M (Minus / 우려점)</label>
                <textarea id="pmi_m" oninput="window.updateComment('m', this.value)" class="w-full text-xs p-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none h-16" placeholder="예: 상점가가 커서 원래 주민들이 쉴 공원이 부족해 보입니다.">${state.comment.m}</textarea>
              </div>
              <div>
                <label class="block text-xs font-display text-slate-700 mb-1">💡 I (Interest / 흥미로운 점)</label>
                <textarea id="pmi_i" oninput="window.updateComment('i', this.value)" class="w-full text-xs p-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none h-16" placeholder="예: 지하철역과 공원을 연결한 아이디어가 흥미롭습니다.">${state.comment.i}</textarea>
              </div>
            </div>

            <button onclick="window.castVote(${targetGroup})" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-display py-3 rounded-xl shadow-sm transition text-sm">
              이 모둠을 최고의 도시로 투표하기 🗳️
            </button>
          </div>
        </div>
      `;
    }

    return `
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-lg font-display text-slate-800">5. 다른 모둠 도시 둘러보기 및 PMI 투표</h2>
            <p class="text-sm text-slate-500">세계시민 관점에서 가장 가고 싶은 경쟁력 있는 도시를 선택해 보세요.</p>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          ${otherGroups.map(g => {
            const t = state.towns['g' + g];
            return `
              <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-3 flex flex-col justify-between">
                <div class="flex justify-between items-center">
                  <span class="font-display text-slate-800">모둠 ${g}</span>
                  <span class="text-xs px-2 py-0.5 rounded-full ${t ? 'bg-emerald-100 text-emerald-700 font-display' : 'bg-slate-200 text-slate-500'}">
                    ${t ? '제출 완료' : '작성 중'}
                  </span>
                </div>
                ${t ? `
                  <div class="text-xs space-y-1 text-slate-600 bg-white p-2.5 rounded-lg border border-slate-100">
                    <div>손님 점수: <b class="text-blue-600">${t.score.guest}점</b></div>
                    <div>주민 점수: <b class="text-emerald-600">${t.score.resident}점</b></div>
                  </div>
                  <button onclick="window.setViewTown(${g})" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-display py-2 rounded-lg text-xs transition">
                    도시 탐방 & PMI 평가하기
                  </button>
                ` : `
                  <div class="h-24 flex items-center justify-center text-xs text-slate-400">
                    아직 도시를 작성 중입니다.
                  </div>
                `}
              </div>
            `;
          }).join('')}
        </div>

        <div class="flex justify-end pt-4 border-t border-slate-100">
          <button onclick="window.goStep(6)" class="bg-teal-600 hover:bg-teal-700 text-white font-display px-6 py-2.5 rounded-xl shadow-sm transition text-sm">
            투표 결과 및 요약 보기 →
          </button>
        </div>
      </div>
    `;
  }

  function viewStep6() {
    const voteCounts = {};
    Object.values(state.votes).forEach(v => {
      voteCounts[v.target] = (voteCounts[v.target] || 0) + 1;
    });

    return `
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
        <h2 class="text-xl font-display text-slate-800 border-b border-slate-100 pb-3">6. 투표 결과 & 배움 요약</h2>

        <div class="space-y-4">
          <h3 class="font-display text-slate-700">🏆 가장 방문하고 싶은 경쟁력 있는 도시 결과</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${[1, 2, 3, 4, 5, 6].filter(g => state.towns['g'+g]).map(g => {
              const count = voteCounts[g] || 0;
              return `
                <div class="border border-slate-200 rounded-xl p-4 flex justify-between items-center bg-slate-50">
                  <div>
                    <span class="font-display text-slate-800 text-base">모둠 ${g}의 도시</span>
                    <div class="text-xs text-slate-500 mt-1">
                      손님 ${state.towns['g'+g].score.guest}점 | 주민 ${state.towns['g'+g].score.resident}점
                    </div>
                  </div>
                  <span class="bg-teal-600 text-white font-display px-4 py-2 rounded-xl text-lg">
                    ${count} 득표
                  </span>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-xl p-5 space-y-3">
          <h3 class="font-display text-amber-900 text-base">📌 배움 요약하기</h3>
          <ul class="text-xs md:text-sm text-amber-800 space-y-2 list-disc pl-5">
            <li><b>도시 개발이란?</b> 땅을 목적에 맞게 계획해서 새롭게 이용하고 정비하는 것입니다.</li>
            <li><b>경쟁력 있는 도시의 특징:</b> 편리한 교통, 다양한 볼거리와 상업 시설, 주민의 휴식 공간이 조화를 이루어야 합니다.</li>
            <li><b>올바른 개발의 방향:</b> 경제적 가치를 높이면서도 기존 주민의 쾌적한 삶을 함께 존중해야 합니다.</li>
          </ul>
        </div>
      </div>
    `;
  }

  window.goStep = function(s) {
    state.step = s;
    render();
  };

  window.selectGroup = function(g) {
    state.group = g;
    render();
  };

  window.togglePick = function(k) {
    const idx = state.picks.indexOf(k);
    if(idx >= 0) {
      state.picks.splice(idx, 1);
      delete state.pc[k];
    } else {
      if(state.picks.length < 4) {
        state.picks.push(k);
      } else {
        showToast('최대 4장의 카드만 선택할 수 있습니다.');
      }
    }
    render();
  };

  window.selectFacility = function(k) {
    state.sel = k;
    render();
  };

  window.onCellClick = function(r, c) {
    if(!state.sel) {
      showToast('배치할 시설을 먼저 선택해 주세요.');
      return;
    }
    const k = state.sel;
    const isRot = !!state.rot[k];
    const check = isValidPlacement(k, r, c, isRot, state.pc);
    if(!check.ok) {
      showToast(check.msg);
      return;
    }
    state.pc[k] = { r, c };
    render();
  };

  window.onPieceClick = function(k) {
    state.sel = k;
    render();
  };

  window.rotateSelected = function() {
    if(!state.sel) return;
    const k = state.sel;
    state.rot[k] = !state.rot[k];
    if(state.pc[k]) {
      const check = isValidPlacement(k, state.pc[k].r, state.pc[k].c, state.rot[k], state.pc);
      if(!check.ok) {
        showToast('회전 시 범위를 벗어나거나 기존 시설과 겹칩니다.');
        state.rot[k] = !state.rot[k];
      }
    }
    render();
  };

  window.removeSelected = function() {
    if(!state.sel) return;
    delete state.pc[state.sel];
    render();
  };

  window.submitTown = function() {
    const score = calculateScore(state.picks, state.pc);
    state.towns['g' + state.group] = {
      picks: [...state.picks],
      pc: JSON.parse(JSON.stringify(state.pc)),
      score: score
    };
    showToast(`모둠 ${state.group}의 도시가 게시판에 성공적으로 제출되었습니다!`);
    window.goStep(5);
  };

  window.setViewTown = function(g) {
    state.viewTown = g;
    state.comment = { p: '', m: '', i: '' };
    render();
  };

  window.updateComment = function(field, val) {
    state.comment[field] = val;
  };

  window.castVote = function(targetGroup) {
    if(!state.comment.p || !state.comment.m) {
      showToast('PMI 평가 중 좋은 점(P)과 우려점(M)을 입력해 주세요.');
      return;
    }
    state.votes['g' + state.group] = {
      target: targetGroup,
      comment: { ...state.comment }
    };
    showToast(`모둠 ${targetGroup}에 투표를 완료했습니다!`);
    state.viewTown = null;
    window.goStep(6);
  };

  function render() {
    const app = document.getElementById('app');
    if(!app) return;

    let content = '';
    switch(state.step) {
      case 1: content = viewStep1(); break;
      case 2: content = viewStep2(); break;
      case 3: content = viewStep3(); break;
      case 4: content = viewStep4(); break;
      case 5: content = viewStep5(); break;
      case 6: content = viewStep6(); break;
      default: content = viewStep1();
    }

    app.innerHTML = renderHeader() + content;
  }

  window.onload = function() {
    render();
  };
})();
</script>
</body>
</html>
